<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Where's My Car</title>
  <meta name="theme-color" content="#0b3d2e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="map"></div>

  <div id="crosshair" class="crosshair hidden">
    <div class="crosshair-pin">🚗</div>
    <div class="crosshair-dot"></div>
  </div>

  <button id="sethome-btn" class="floatbtn floatbtn-left" aria-label="Set home to my location">🏠</button>
  <button id="fit-btn" class="floatbtn floatbtn-left floatbtn-left-2 hidden" aria-label="Fit home and car">⤢</button>

  <div class="panel">
    <!-- State A: no spot saved -->
    <section id="park-view" class="view">
      <button id="park-btn" class="btn btn-primary btn-big">📍 I parked here</button>
      <button id="placemap-btn" class="btn btn-secondary">✋ Set it on the map</button>
      <p class="hint">Use GPS if you're at the car — or set it on the map from anywhere.</p>
    </section>

    <!-- State B: spot saved -->
    <section id="find-view" class="view hidden">
      <div id="distance" class="distance"></div>
      <div id="from-home" class="subtle hidden"></div>
      <div id="moveby-banner" class="banner hidden"></div>
      <a id="walk-btn" class="btn btn-primary btn-big" href="#">🧭 Walk to my car</a>
      <div class="actions">
        <button id="move-btn" class="btn btn-secondary">📍 Move</button>
        <button id="edit-btn" class="btn btn-secondary">✏️ Note</button>
        <button id="clear-btn" class="btn btn-secondary">✓ Got it</button>
      </div>
      <div id="edit-form" class="hidden">
        <label class="field">
          <span>Note</span>
          <input id="note-input" type="text" placeholder="e.g. Audubon side, by the hydrant" />
        </label>
        <label class="field">
          <span>Move by (sends a Discord ping 5 min before)</span>
          <input id="moveby-input" type="datetime-local" />
        </label>
        <button id="save-edit-btn" class="btn btn-primary">Save</button>
      </div>
    </section>

    <!-- Placing mode: drag the map under the center crosshair -->
    <section id="place-view" class="view hidden">
      <p class="place-hint">Drag the map so the 🚗 sits where you parked</p>
      <div class="actions">
        <button id="place-cancel" class="btn btn-secondary">Cancel</button>
        <button id="place-save" class="btn btn-primary">✓ Save here</button>
      </div>
    </section>

    <div id="error" class="error hidden"></div>
  </div>

  <script src="/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
