name: Hydrant data

# Refreshes src/data/hydrants.json from NYC DEP's hydrant open data (within
# ~1 km of home). Runs monthly or by hand; commits only on change.

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_hydrants.py src/data/hydrants.json
      - name: Commit if changed
        run: |
          git add -N src/data/hydrants.json
          # generatedAt always changes; only commit when the hydrants did.
          if git diff --quiet -I '"generatedAt"' -- src/data/hydrants.json; then echo "No hydrant changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hydrants.json
          git commit -m "Refresh hydrant data"
          git push
