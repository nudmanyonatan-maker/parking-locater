name: CI / deploy

# Always: typecheck, lint, test, build.
# Deploy to Cloudflare (pushes to main, or run by hand) only when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist
# (see README.md). Optional secrets: PARKNEARME_ADMIN_TOKEN,
# VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY. DISCORD_WEBHOOK_URL is already a
# secret on the Worker and is left alone.

on:
  push:
    paths-ignore:
      - "feasibility/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # = bash -eo pipefail, so piped commands fail the step
    env:
      # Deploy only from main (or a manual run), never from pull requests or other branches.
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Find or create the D1 database
        if: env.HAS_CF == 'true'
        run: npm run db:ensure

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        if: env.HAS_CF == 'true'
        run: npx wrangler d1 migrations apply parknearme --remote

      - name: Deploy
        id: deploy
        if: env.HAS_CF == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          [ -n "$url" ] || { echo "::error::wrangler deploy printed no workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set secrets
        if: env.HAS_CF == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.PARKNEARME_ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          # Never treat a failed listing as "no secrets": that would regenerate the
          # VAPID keys and silently break every existing push subscription.
          existing=""
          for i in 1 2 3; do
            if existing=$(npx wrangler secret list --format json); then break; fi
            existing=""
            sleep $((i * 5))
          done
          [ -n "$existing" ] || { echo "::error::could not list Worker secrets"; exit 1; }
          has() { echo "$existing" | grep -q "\"name\": *\"$1\""; }
          if [ -n "$ADMIN_TOKEN" ]; then
            printf %s "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          elif ! has ADMIN_TOKEN; then
            echo "::warning::No PARKNEARME_ADMIN_TOKEN secret and no ADMIN_TOKEN on the Worker: calibration/admin routes stay locked."
          fi
          if [ -n "$VAPID_PUBLIC_KEY" ] && [ -n "$VAPID_PRIVATE_KEY" ]; then
            printf '{"VAPID_PUBLIC_KEY":"%s","VAPID_PRIVATE_KEY":"%s"}' "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" > /tmp/vapid.json
            npx wrangler secret bulk /tmp/vapid.json && rm -f /tmp/vapid.json
          elif ! has VAPID_PRIVATE_KEY; then
            # Generate once and keep on the Worker; later deploys see it and skip this.
            node scripts/generate-vapid-keys.mjs --json > /tmp/vapid.json
            npx wrangler secret bulk /tmp/vapid.json && rm -f /tmp/vapid.json
            echo "Generated VAPID keys and stored them as Worker secrets."
          fi

      - name: Summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$HAS_CF" = "true" ] && [ "$DEPLOY_OUTCOME" = "success" ] && [ -n "$DEPLOY_URL" ]; then
            echo "### Deployed: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_CF" = "true" ]; then
            echo "### Deploy skipped or failed (outcome: ${DEPLOY_OUTCOME:-not run})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$JOB_STATUS" != "success" ]; then
            echo "### Checks failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Checks passed, deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (see README.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
