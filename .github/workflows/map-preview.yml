name: Map preview

# Screenshots the live app in each map look (dark and light) to pick one.
on:
  workflow_dispatch:
    inputs:
      url:
        description: App URL
        default: https://parking-locator.excel-capital.workers.dev

permissions:
  contents: write # pushes the screenshots to the map-preview branch

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (uses the runner's Chrome)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p /tmp/pw && cp scripts/map-preview.mjs /tmp/pw/
          cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2
      - run: node /tmp/pw/map-preview.mjs "${{ inputs.url }}" "$GITHUB_WORKSPACE/map-preview"
      - name: Push screenshots to the map-preview branch
        run: |
          cd map-preview
          git init -q -b map-preview
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Map preview" --allow-empty
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Map preview screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" map-preview
